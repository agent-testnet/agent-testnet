# Local development server config.
# For production deployment, install.sh creates /opt/testnet/configs/server.yaml
# with absolute paths automatically.
controlplane:
  listen: ":8443"
  data_dir: "./data"
  nodes_file: "./configs/nodes.yaml"
  tls:
    cert_file: "./data/api-cert.pem"
    key_file: "./data/api-key.pem"
  ca:
    key_file: "./data/ca-key.pem"
    cert_file: "./data/ca-cert.pem"

dns:
  listen_tunnel: "83.150.0.1:53"
  listen_public: ":5353"
  refresh_interval: "10s"

wireguard:
  listen_port: 51820
  tunnel_ip: "10.99.0.1/16"
  private_key_file: "./data/wg-key"

router:
  log_file: "./data/traffic.log"

vip:
  subnet: "83.150.0.0/16"
  dns_vip: "83.150.0.1"

# Unified request log: DNS queries, HTTP requests through the MITM proxy,
# conntrack flows, and iptables-drop events all stream to one JSONL file.
# Tail with: tail -f ./data/requests.log | jq -c .
observability:
  log_file: "./data/requests.log"
  log_drops: true

# Transparent MITM proxy that terminates agent TLS with on-the-fly
# testnet-CA-signed certs so HTTP method, URL and status can be logged.
# Listen addresses must match the REDIRECT targets installed by the
# router; agents never connect here directly.
proxy:
  http_listen: ":18080"
  https_listen: ":18443"
